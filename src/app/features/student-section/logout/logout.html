<app-sidebar></app-sidebar>
<div class="logout-wrap">
  <div class="card logout-card">
    <svg class="logout-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <path d="m15 16 5-4-5-4" />
      <path d="M20 12H9" />
    </svg>
    <p>Are you sure you want to log out?</p>
    <div class="logout-card__actions">
      <button type="button" class="btn btn--primary btn--pill" (click)="onCancel()">Cancel</button>
      <button type="button" class="btn btn--danger btn--pill" (click)="onConfirmLogout()">Log out</button>
    </div>
  </div>
</div>
