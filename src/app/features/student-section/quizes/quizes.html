<app-search-header></app-search-header>
<app-sidebar></app-sidebar>

<div class="quiz-page">
  <h1>Quizzes</h1>

  <p class="subtitle">Test Yourself</p>

  <div class="categories">
    <button
      class="category"
      [class.active]="selectedCategory === 'All'"
      (click)="selectCategory('All')"
    >
      All
    </button>

    <button
      class="category"
      [class.active]="selectedCategory === 'HTML & CSS'"
      (click)="selectCategory('HTML & CSS')"
    >
      HTML & CSS
    </button>

    <button
      class="category"
      [class.active]="selectedCategory === 'Javascript'"
      (click)="selectCategory('Javascript')"
    >
      Javascript
    </button>

    <button
      class="category"
      [class.active]="selectedCategory === 'React'"
      (click)="selectCategory('React')"
    >
      React
    </button>

    <button
      class="category"
      [class.active]="selectedCategory === 'Python'"
      (click)="selectCategory('Python')"
    >
      Python
    </button>

    <button
      class="category"
      [class.active]="selectedCategory === 'Java'"
      (click)="selectCategory('Java')"
    >
      Java
    </button>

    <button
      class="category"
      [class.active]="selectedCategory === 'C++'"
      (click)="selectCategory('C++')"
    >
      C++
    </button>

    <button
      class="category"
      [class.active]="selectedCategory === 'Git & GitHub'"
      (click)="selectCategory('Git & GitHub')"
    >
      Git & GitHub
    </button>
  </div>

  <p class="results">{{ filteredQuizzes.length }} results</p>

  <div class="quiz-container">
    @for (quiz of filteredQuizzes; track quiz.name) {
      <div class="quiz-card">
        <div class="quiz-logo {{ quiz.logo }}">
          <i [class]="quiz.icon"></i>
        </div>

        <div class="quiz-info">
          <h3>
            {{ quiz.name }}
          </h3>

          <p>{{ quiz.questions }} Questions</p>
        </div>

        <div class="quiz-actions">
          <span class="quiz-time"> 15 mins </span>

          <button class="start-btn">Start Now</button>
        </div>
      </div>
    }
  </div>
</div>
